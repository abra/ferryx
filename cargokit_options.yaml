# Read by every cargokit in the build (ours in rust_builder/ and the one
# super_native_extensions ships). Crates that publish signed precompiled
# binaries (super_native_extensions, for drag and drop) prefer downloads.
# Failed downloads fall back to a source build; macos/Podfile keeps its
# compiler on rustup's stable toolchain. Our own crate publishes no binaries
# and is always built from source.
use_precompiled_binaries: true
