[package]
name = "ferryx_test_servers"
description = "In-process SFTP, FTP(S) and WebDAV servers over a temporary folder, for Ferryx's network tests: no external server is needed."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tokio.workspace = true
chrono.workspace = true
russh.workspace = true
russh-sftp.workspace = true
rustls.workspace = true
rcgen.workspace = true
filetime.workspace = true
tempfile.workspace = true
base64.workspace = true
parking_lot.workspace = true
dav-server = { version = "0.8", default-features = false, features = ["localfs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
