[package]
name = "ferryx_core"
description = "Pure logic of Ferryx: file entries, sorting with natural collation, file masks, quick search matching and the batch-rename language."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono.workspace = true
regex.workspace = true
serde.workspace = true
asciidoc-html5 = "0.2.3"
rst_parser = "0.4.2"
rst_renderer = "0.4.2"
rclip-rtf = { version = "0.1.0", features = ["alloc", "codepage"] }
office_oxide = { version = "=0.1.16", default-features = false }

[dev-dependencies]
zip.workspace = true
