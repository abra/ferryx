[package]
name = "ferryx_ops"
description = "File operations of Ferryx, run in the background with progress, pause, cancellation and questions: copy, move, delete, trash, duplicate, compress, extract, folder sizes, find files, batch rename."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ferryx_core.workspace = true
ferryx_vfs.workspace = true
aho-corasick.workspace = true
crossbeam-channel.workspace = true
filetime.workspace = true
memchr.workspace = true
parking_lot.workspace = true
regex.workspace = true
serde.workspace = true
walkdir.workspace = true
zip.workspace = true
# Every core for a verified copy's and a big file's BLAKE3 (rayon is in
# the build already).
blake3 = { workspace = true, features = ["rayon"] }
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true

# clonefile and copyfile on macOS; holes and the page cache on Linux.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# SHA-256 in the ARMv8 instructions (Apple silicon) rather than in software:
# about five times as fast. Not on Windows, whose toolchain the crate's
# assembly does not build with.
[target.'cfg(all(target_arch = "aarch64", not(windows)))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
tempfile.workspace = true
flate2.workspace = true
tar.workspace = true
# ─── Network ───
ferryx_test_servers.workspace = true
