[package]
name = "ferryx_ops"
description = "File operations of Ferryx, run in the background with progress, pause, cancellation and questions: copy, move, delete, trash, duplicate, compress, extract, folder sizes, find files, batch rename."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ferryx_core.workspace = true
ferryx_vfs.workspace = true
filetime.workspace = true
parking_lot.workspace = true
serde.workspace = true
walkdir.workspace = true
zip.workspace = true
blake3.workspace = true
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true

# SHA-256 in the ARMv8 instructions (Apple silicon) rather than in software:
# about five times as fast. Not on Windows, whose toolchain the crate's
# assembly does not build with.
[target.'cfg(all(target_arch = "aarch64", not(windows)))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
tempfile.workspace = true
flate2.workspace = true
tar.workspace = true
