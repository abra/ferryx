<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>Ferryx</title>
<defs>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#A8622F"/>
    <stop offset="0.5" stop-color="#6E3B16"/>
    <stop offset="1" stop-color="#3E2009"/>
  </linearGradient>
  <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#B86F38"/>
    <stop offset="1" stop-color="#5A2E10"/>
  </linearGradient>
  <radialGradient id="brass" cx="0.35" cy="0.3" r="0.85">
    <stop offset="0" stop-color="#FFEDB5"/>
    <stop offset="0.45" stop-color="#DBAA4C"/>
    <stop offset="1" stop-color="#7E5217"/>
  </radialGradient>
  <radialGradient id="brassDeep" cx="0.4" cy="0.35" r="0.9">
    <stop offset="0" stop-color="#C08A33"/>
    <stop offset="1" stop-color="#5E3C0F"/>
  </radialGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
    <feOffset dy="5" result="o"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <g id="spoke">
    <rect x="122.5" y="24" width="11" height="22" rx="5.5" fill="url(#handle)"/>
    <rect x="124" y="42" width="8" height="64" rx="3" fill="url(#wood)"/>
    <rect x="125" y="26" width="2" height="15" rx="1" fill="#FFFFFF" fill-opacity="0.28"/>
  </g>
</defs>
<!-- Fluent: the helm alone, no plate; the same drawing as macOS at a quarter of its grid. -->
<g filter="url(#shadow)">
  <use href="#spoke"/>
  <use href="#spoke" transform="rotate(45 128 128)"/>
  <use href="#spoke" transform="rotate(90 128 128)"/>
  <use href="#spoke" transform="rotate(135 128 128)"/>
  <use href="#spoke" transform="rotate(180 128 128)"/>
  <use href="#spoke" transform="rotate(225 128 128)"/>
  <use href="#spoke" transform="rotate(270 128 128)"/>
  <use href="#spoke" transform="rotate(315 128 128)"/>
  <circle cx="128" cy="128" r="76" fill="none" stroke="url(#wood)" stroke-width="13"/>
  <circle cx="128" cy="128" r="50" fill="none" stroke="url(#wood)" stroke-width="7"/>
  <circle cx="128" cy="128" r="24" fill="url(#brass)"/>
</g>
<path d="M63 90.5 A76 76 0 0 1 166 63" fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3" stroke-linecap="round"/>
<circle cx="128" cy="128" r="14" fill="url(#brassDeep)"/>
<circle cx="128" cy="128" r="5" fill="#FFEDB5" fill-opacity="0.9"/>
</svg>
