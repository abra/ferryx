<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
<title>Ferryx</title>
<defs>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2B5CA8"/>
    <stop offset="1" stop-color="#0F2250"/>
  </linearGradient>
  <g id="spoke">
    <rect x="15" y="3.2" width="2" height="5.2" rx="1" fill="#B9733A"/>
    <rect x="15.25" y="7" width="1.5" height="7" fill="#8A5230"/>
  </g>
</defs>
<!-- At 16 and 32 px: the tile, the rim, eight spokes and the hub, no grain. -->
<rect x="2" y="2" width="28" height="28" rx="7" fill="url(#sea)"/>
<use href="#spoke"/>
<use href="#spoke" transform="rotate(45 16 16)"/>
<use href="#spoke" transform="rotate(90 16 16)"/>
<use href="#spoke" transform="rotate(135 16 16)"/>
<use href="#spoke" transform="rotate(180 16 16)"/>
<use href="#spoke" transform="rotate(225 16 16)"/>
<use href="#spoke" transform="rotate(270 16 16)"/>
<use href="#spoke" transform="rotate(315 16 16)"/>
<circle cx="16" cy="16" r="9" fill="none" stroke="#8A5230" stroke-width="2.6"/>
<circle cx="16" cy="16" r="3.4" fill="#E2B35C"/>
<circle cx="16" cy="16" r="1.4" fill="#7E5217"/>
</svg>
