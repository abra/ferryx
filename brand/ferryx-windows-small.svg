<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
<title>Ferryx</title>
<defs>
  <g id="spoke">
    <rect x="15" y="1.5" width="2" height="5.5" rx="1" fill="#B9733A"/>
    <rect x="15.25" y="6" width="1.5" height="8" fill="#8A5230"/>
  </g>
</defs>
<!-- 16–32 px on a taskbar: the helm alone, its rim and hub bold enough for either theme. -->
<use href="#spoke"/>
<use href="#spoke" transform="rotate(45 16 16)"/>
<use href="#spoke" transform="rotate(90 16 16)"/>
<use href="#spoke" transform="rotate(135 16 16)"/>
<use href="#spoke" transform="rotate(180 16 16)"/>
<use href="#spoke" transform="rotate(225 16 16)"/>
<use href="#spoke" transform="rotate(270 16 16)"/>
<use href="#spoke" transform="rotate(315 16 16)"/>
<circle cx="16" cy="16" r="10" fill="none" stroke="#8A5230" stroke-width="3"/>
<circle cx="16" cy="16" r="4" fill="#E2B35C"/>
<circle cx="16" cy="16" r="1.6" fill="#7E5217"/>
</svg>
