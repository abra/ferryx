name: checksums_feature
description: "Checksums: hashes of files (SHA-256, SHA-1, MD5, BLAKE3) computed in the core, a table to copy them from or save as a checksum file, and the check of a checksum file."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  meta: ^1.16.0
  domain_models:
    path: ../../domain_models
  component_library:
    path: ../../component_library
  ferryx_localizations:
    path: ../../ferryx_localizations
  operations_service:
    path: ../../operations_service
  shortcuts:
    path: ../../shortcuts
  material_ui: ^1.11.0

dev_dependencies:
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
