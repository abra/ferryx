name: panels_feature
description: "The main window: two file panels with tabs, the operations strip, the dialogs of every file command, favorites and quick lists."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  meta: ^1.16.0
  path: ^1.9.1
  domain_models:
    path: ../../domain_models
  component_library:
    path: ../../component_library
  ferryx_localizations:
    path: ../../ferryx_localizations
  file_repository:
    path: ../../file_repository
  operations_service:
    path: ../../operations_service
  platform_services:
    path: ../../platform_services
  preferences_service:
    path: ../../preferences_service
  monitoring:
    path: ../../monitoring
  shortcuts:
    path: ../../shortcuts
  network_service:
    path: ../../network_service
  material_ui: ^1.11.0

dev_dependencies:
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
