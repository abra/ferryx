name: terminal_feature
description: "The integrated terminal: the user's shell under the panels or over the whole window, following the active panel's folder both ways."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  meta: ^1.16.0
  # Terminal emulation and rendering (VT100/xterm, 256 colours, mouse).
  xterm: ^4.0.0
  domain_models:
    path: ../../domain_models
  component_library:
    path: ../../component_library
  ferryx_localizations:
    path: ../../ferryx_localizations
  preferences_service:
    path: ../../preferences_service
  shortcuts:
    path: ../../shortcuts
  terminal_service:
    path: ../../terminal_service
  material_ui: ^1.11.0

dev_dependencies:
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
