name: palette_feature
description: "The command palette: every command that can run where the focus is, found by a fuzzy search and run as its key would."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  meta: ^1.16.0
  component_library:
    path: ../../component_library
  ferryx_localizations:
    path: ../../ferryx_localizations
  preferences_service:
    path: ../../preferences_service
  shortcuts:
    path: ../../shortcuts
  material_ui: ^1.11.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
