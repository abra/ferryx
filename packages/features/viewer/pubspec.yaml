name: viewer_feature
description: "The built-in viewer: text, hex, Markdown, images and Pagecraft document previews over local, archive and remote files."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  meta: ^1.16.0
  flutter_markdown_plus: ^1.0.12
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.6
  re_highlight: ^0.0.3
  csv: ^6.0.0
  markdown: ^7.3.1
  path: ^1.9.1
  diff_match_patch: ^0.4.1
  domain_models:
    path: ../../domain_models
  component_library:
    path: ../../component_library
  ferryx_localizations:
    path: ../../ferryx_localizations
  file_repository:
    path: ../../file_repository
  preferences_service:
    path: ../../preferences_service
  shortcuts:
    path: ../../shortcuts
  pagecraft:
    path: ../../pagecraft
  material_ui: ^1.11.0

dependency_overrides:
  pdfium_dart:
    path: ../../pdfium_dart

dev_dependencies:
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
